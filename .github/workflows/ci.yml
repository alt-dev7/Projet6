name: CI

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  packages: write

env:
  REGISTRY: ghcr.io
  NODE_VERSION: 22

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [angular, java]

    env:
      JAVA_VERSION: 21
      DB_CONTAINER: pg-${{ github.run_id }}
      POSTGRES_USER: workshops_user
      POSTGRES_PASSWORD: oc2024
      POSTGRES_DB: workshopsdb

    steps:
      - uses: actions/checkout@v4

      - if: matrix.app == 'angular'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Chrome pour Karma
        if: matrix.app == 'angular'
        run: |
          sudo=$(command -v sudo || true)
          $sudo apt-get update -qq
          $sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/chrome" | tee chrome.log
          echo "CHROME_BIN=$(tail -n 1 chrome.log | cut -d' ' -f2-)" >> "$GITHUB_ENV"

      - if: matrix.app == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Démarrage de PostgreSQL
        if: matrix.app == 'java'
        run: |
          docker run -d --name "$DB_CONTAINER" -p 5432:5432 \
            -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB postgres:13
          until docker exec "$DB_CONTAINER" pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done

      - name: Tests
        run: ./run-tests.sh ${{ matrix.app }}

      - name: Arrêt de PostgreSQL
        if: always() && matrix.app == 'java'
        run: docker rm -f "$DB_CONTAINER"

      - name: Rapport des tests
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results/${{ matrix.app }}/*.xml
          check_name: Tests ${{ matrix.app }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.app }}
          path: test-results/${{ matrix.app }}

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [angular, java]

    env:
      IMAGE: ${{ github.repository }}/${{ matrix.app }}
      POSTGRES_USER: workshops_user
      POSTGRES_PASSWORD: oc2024
      POSTGRES_DB: workshopsdb

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}

      - name: Construction de l'image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      - name: Test de l'image Angular
        if: matrix.app == 'angular'
        run: |
          docker run -d --name app -p 8080:80 "$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          curl --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors -fsS http://localhost:8080/ > /dev/null

      - name: Test de l'image Java
        if: matrix.app == 'java'
        run: |
          docker run -d --name db -p 5432:5432 -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB postgres:13
          until docker exec db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
          docker run -d --name app --network host "$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)"
          curl --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors -fsS http://localhost:8080/api/workshops > /dev/null

      - name: Logs de l'application
        if: failure()
        run: docker logs app

      - name: Nettoyage
        if: always()
        run: docker rm -f app db || true

      - name: Publication de l'image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    strategy:
      max-parallel: 1
      matrix:
        app: [angular, java]

    env:
      IMAGE: ${{ github.repository }}/${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Installation de semantic-release
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/sr" semantic-release@25 semantic-release-monorepo@8.0.2 \
            @semantic-release/changelog @semantic-release/exec @semantic-release/git
          # semantic-release-monorepo repère le projet grâce à son package.json
          [ -f java/package.json ] || echo '{"name":"java"}' > java/package.json

      - name: Release
        id: release
        working-directory: ${{ matrix.app }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_PATH: ${{ runner.temp }}/sr/node_modules
        run: ${{ runner.temp }}/sr/node_modules/.bin/semantic-release

      - name: Tags de version de l'image
        if: steps.release.outputs.version != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="$REGISTRY/$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools create \
            -t "$image:${{ steps.release.outputs.version }}" -t "$image:latest" \
            "$image:main-${GITHUB_SHA::7}"
