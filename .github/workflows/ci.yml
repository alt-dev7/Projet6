name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [angular, java]

    env:
      NODE_VERSION: 22
      JAVA_VERSION: 21
      DB_CONTAINER: pg-${{ github.run_id }}
      POSTGRES_USER: workshops_user
      POSTGRES_PASSWORD: oc2024
      POSTGRES_DB: workshopsdb

    steps:
      - uses: actions/checkout@v4

      - if: matrix.app == 'angular'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Chrome pour Karma
        if: matrix.app == 'angular'
        run: |
          sudo=$(command -v sudo || true)
          $sudo apt-get update -qq
          $sudo apt-get install -y -qq libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            libpango-1.0-0 libcairo2
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path "$RUNNER_TEMP/chrome" | tee chrome.log
          echo "CHROME_BIN=$(tail -n 1 chrome.log | cut -d' ' -f2-)" >> "$GITHUB_ENV"

      - if: matrix.app == 'java'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Démarrage de PostgreSQL
        if: matrix.app == 'java'
        run: |
          docker run -d --name "$DB_CONTAINER" -p 5432:5432 \
            -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB postgres:13
          until docker exec "$DB_CONTAINER" pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done

      - name: Tests
        run: ./run-tests.sh ${{ matrix.app }}

      - name: Arrêt de PostgreSQL
        if: always() && matrix.app == 'java'
        run: docker rm -f "$DB_CONTAINER"

      - name: Rapport des tests
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results/${{ matrix.app }}/*.xml
          check_name: Tests ${{ matrix.app }}

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.app }}
          path: test-results/${{ matrix.app }}
